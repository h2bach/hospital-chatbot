<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Trợ lý AI Bệnh viện Tim Hà Nội tra cứu cơ sở, phòng khoa, bác sĩ và lịch làm việc công khai."
    />
    <meta name="theme-color" content="#f4f7fc" />
    <link rel="icon" type="image/png" href="./bvtim_logo.png" />
    <script>
      try {
        const params = new URLSearchParams(window.location.search)
        const requestedTheme = params.get("theme")
        const savedTheme = localStorage.getItem("bvtim-chat-theme")
        document.documentElement.dataset.theme =
          requestedTheme === "light" || requestedTheme === "dark"
            ? requestedTheme
            : savedTheme === "light" || savedTheme === "dark"
              ? savedTheme
              : "light"
        document.documentElement.dataset.embedded =
          params.get("embed") === "1" ||
          params.get("embed") === "true" ||
          window.self !== window.top
            ? "true"
            : "false"
      } catch {
        document.documentElement.dataset.theme = "light"
      }
    </script>
    <title>Trợ lý Tim Hà Nội</title>
    <script type="module" crossorigin src="./assets/index-DV2q6P8V.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BKCIVhFE.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
