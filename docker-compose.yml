services:
  rag-core:
    build:
      context: .
      dockerfile: rag-core/Dockerfile
    environment:
      RAG_EMBEDDING_DEVICE: cpu
      DENSE_RETRIEVAL_URL: ""
    expose:
      - "6689"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6689/health', timeout=2).read()",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  hospital-info-service:
    build:
      context: ./hospital-info-service
    command: ["--port", "8080", "--data", "/app/data"]
    volumes:
      - ./hospital-data:/app/data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    restart: unless-stopped

  hospital-data-dashboard:
    build:
      context: ./hospital-data/web-dashboard
    depends_on:
      hospital-info-service:
        condition: service_healthy
    ports:
      - "8082:8080"
    restart: unless-stopped

  ai-agent:
    build:
      context: ./ai-agent
    env_file:
      - .env
    environment:
      PORT: "8080"
      AGENT_STATIC_DIR: /app/static
      HOSPITAL_INFO_SERVICE_URL: http://hospital-info-service:8080
      RAG_SERVICE_URL: http://rag-core:6689
    depends_on:
      hospital-info-service:
        condition: service_healthy
      rag-core:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
