[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "heartcare-rag-core"
version = "0.1.0"
description = "Traceable hybrid RAG foundation for HeartCare AI"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
models = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["rag_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

